[package]
name = "musicbot_audio_lavalink"
version = "0.3.0"
edition = "2021"

[dependencies]
musicbot_core = { path = "../core" }

lavalink-rs = "0.12"
tokio = { version = "1", features = ["full"] }
serenity = { version = "0.12", features = ["client", "model", "voice"] }
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"