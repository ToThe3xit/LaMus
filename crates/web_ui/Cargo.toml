[package]
name = "musicbot_web_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
musicbot_audio_lavalink = { path = "../audio_lavalink" }
musicbot_core = { path = "../core" }
musicbot_auth = { path = "../auth" }

serenity = "0.12"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
anyhow = "1.0"
serde_yaml = "0.9"
tower-cookies = "0.10"