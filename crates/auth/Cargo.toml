[package]
name = "musicbot_auth"
version = "0.3.0"
edition = "2021"

[dependencies]
musicbot_core = { path = "../core" }

axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
tower-cookies = "0.10"